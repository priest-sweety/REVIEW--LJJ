contract_version: "0.1.0"
design_status: "DRAFT"
scientific_question: "Which intercellular signaling axes reprogram innate and adaptive immunity from tissue repair toward chronic fibroinflammation and tumor immune evasion?"
primary_hypothesis: "Reciprocal circuits linking injured/neoplastic epithelium (SPHK1/S1P, ICAM-1, IL-6, FOSL1), heterogeneous PSCs/CAFs (IL-33, C3, CTHRC1-EGFR, PLXDC1, CCL19), plastic myeloid subsets (SPP1+/NLRP3+ TAMs, CXCR2/NETs), T cell subsets (CCR6-CCL20, FOXP3+ Treg), and TGFBI+ Schwann cells drive niche evolution."
independent_biological_unit: "Defined ligand-receptor or metabolic/mechanical signaling circuit validated in primary literature"
authorized_inputs:
  - "manuscript/MANUSCRIPT_DRAFT.zh-CN.md"
  - "manuscript/REVIEW_SYNTHESIS_AND_ROADMAP.zh-CN.md"
  - "ref-article/LITERATURE_CATALOG.tsv"
primary_comparisons:
  - "Reparative IL-33/Th2 & transient macrophage states (AP) vs fibrogenic S1P-S1PR2/TGF-B/MMT & CCR6-CCL20 circuits (CP)"
  - "Anti-fibrotic Treg restraint in CP vs focal precancerous & PDAC Treg/TAM immunosuppression"
  - "Immune-excluded PLXDC1+ TPSC/myCAF stroma vs CCL19+ TPSC/TLS & TGFBI+ Schwann perineural niches"
qc_and_exclusion_rules:
