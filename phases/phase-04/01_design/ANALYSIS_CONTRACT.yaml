contract_version: "0.1.0"
design_status: "DRAFT"
scientific_question: "How can stage-dependent vulnerabilities of the pancreatic inflammatory niche be therapeutically targeted without disrupting protective repair or stromal restraint?"
primary_hypothesis: "Effective intervention requires stage-matched precision: dampening hyperinflammation while preserving regeneration in AP, restoring CFTR ductal function and blocking S1P/CCR6 fibrogenesis in CP, intercepting high-risk inflammatory/KRAS precursors in PanIN, and combining stromal/myeloid reprogramming with RAS/vaccine/ICB therapies in PDAC."
independent_biological_unit: "Disease stage therapeutic window and clinical/preclinical evidence tier"
authorized_inputs:
  - "manuscript/MANUSCRIPT_DRAFT.zh-CN.md"
  - "manuscript/REVIEW_SYNTHESIS_AND_ROADMAP.zh-CN.md"
  - "ref-article/LITERATURE_CATALOG.tsv"
primary_comparisons:
  - "Preclinical mouse/organoid proof-of-concept vs active or completed human clinical trials"
  - "Indiscriminate stromal depletion vs subtype-selective CAF/myeloid reprogramming"
qc_and_exclusion_rules:
  - "Clearly label preclinical vs clinical evidence tiers"
  - "Highlight stage-flipping targets (e.g., Treg, HBP1, IL-33) where mistimed blockade could cause harm"
analysis_methods:
  - "Stage-window synthesis (3.1 AP, 3.2 CP, 3.3 PanIN interception, 3.4 PDAC combinations + Conclusion)"
  - "Schematic figure & summary table integration"
  - "Full bibliography formatting"
expected_deliverables:
  - "Complete Section 3 (Therapeutic Windows) and Conclusion"
  - "Figures 1-3 and Tables 1-2 specifications"
  - "Publication-ready full review draft"
stop_conditions:
  - "Full-text coherence check, 100% reference verification, and final PI/author review"
reviewer: "priest-sweety"
human_approved: false
