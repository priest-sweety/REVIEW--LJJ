contract_version: "0.1.0"
design_status: "DRAFT"
scientific_question: "How do epithelial, fibroblast/PSC, myeloid, lymphoid, and neurovascular populations reorganize spatially and transcriptionally across AP, CP, PanIN, and PDAC?"
primary_hypothesis: "Transition from reversible regenerative ADM (AP) to fibrotic CP, KRAS-locked PanIN, and invasive PDAC is governed by stage-specific shifts in acinar plasticity (Acinar-REG -> MP11 -> FOSL1+ MP10) coupled to distinct stromal-immune neighborhoods."
independent_biological_unit: "Disease stage and tissue niche compartment (donor/patient/mouse cohort level)"
authorized_inputs:
  - "manuscript/MANUSCRIPT_DRAFT.zh-CN.md"
  - "ref-article/LITERATURE_CATALOG.tsv"
primary_comparisons:
  - "AP reversible ADM (0-24h vs 72h-5d) vs CP persistent Acinar-REG+ and fibrosis"
  - "2D sporadic low-grade PanIN (REF07) vs 3D CODA high-grade dysplasia focal Treg/TAM hotspots (REF19)"
  - "PDAC classical vs basal-like and intratumoral myCAF vs peripheral iCAF vs perineural niche"
qc_and_exclusion_rules:
  - "Harmonize gene/protein nomenclature (human vs mouse)"
  - "Avoid conflating 2D section scarcity with whole-organ absence"
  - "Anchor every quantitative proportion (e.g., Th2 26-50%, MP10 <4%) to its exact source study"
analysis_methods:
  - "Cross-stage comparative matrix synthesis"
  - "Subheading restructuring (1.1 AP, 1.2 CP, 1.3 PanIN, 1.4 PDAC)"
  - "Inline citation backfill and terminology audit"
expected_deliverables:
  - "Audited Section 1 (Cellular Ecology) with subheadings and full inline citations"
  - "Table 1 cross-stage cellular ecology matrix"
stop_conditions:
  - "Every empirical statement in Introduction and Section 1 carries a verified REF citation"
  - "Author sign-off on terminology and 2D-vs-3D PanIN Treg synthesis"
reviewer: "priest-sweety"
human_approved: false
